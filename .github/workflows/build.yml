name: build

on: [push]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start a local MQTT broker
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          printf 'listener 1883\nallow_anonymous true\n' | sudo tee /etc/mosquitto/conf.d/ci.conf
          sudo systemctl restart mosquitto
          sleep 1

      - name: Build against the libc here
        run: make

      - name: Roundtrip test against the local broker
        run: ./smolmqtt_test.libc.elf 127.0.0.1

  tarball:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build \
            libarchive-dev libcjson-dev libcap-dev mosquitto

      - name: Build tarwak
        run: |
          git clone --depth 1 https://github.com/fifteenhex/tarwak.git
          cd tarwak && meson setup build && meson compile -C build

      # Sparse, since nolibc is a handful of headers in a very large tree
      - name: Fetch nolibc and nolibc-extensions
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch v7.2 \
            https://github.com/torvalds/linux.git
          git -C linux sparse-checkout set tools/include/nolibc
          git clone --depth 1 https://github.com/fifteenhex/nolibc-extensions.git

      # A cross prefix even though the target is this machine, and NOPIE=1
      # because upstream nolibc cannot relocate itself.
      - name: Build the static binaries and the rootfs tarball
        run: |
          make SMOL_ARCH=x86_64 CROSS_COMPILE=x86_64-linux-gnu- NOPIE=1 \
               NOLIBCDIR="$PWD/linux/tools/include/nolibc" \
               NOLIBCEXTDIR="$PWD/nolibc-extensions" \
               TARWAK="$PWD/tarwak/build/tarwak" \
               smolmqtt.x86_64.tar
          tar tvf smolmqtt.x86_64.tar

      - name: Roundtrip the static build against a local broker
        run: |
          printf 'listener 1883\nallow_anonymous true\n' | sudo tee /etc/mosquitto/conf.d/ci.conf
          sudo systemctl restart mosquitto
          sleep 1
          ./smolmqtt_test.x86_64.elf 127.0.0.1

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: smolmqtt-rootfs
          path: smolmqtt.x86_64.tar
